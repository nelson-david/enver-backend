name: Server CI/CD

on:
    push:
        branches: [main, staging]
    pull_request:
        branches: [main, staging]

jobs:
    test-and-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Type Check & Build
              run: npm run build
